<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgendaWeb - Práctica 2</title>
    <!-- Enlace al CSS externo -->
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <header>
        <h1>Mi Agenda Web</h1>
    </header>

    <main class="contenedor">
        <!-- 1. Formulario de alta de evento -->
        <section class="seccion-formulario">
            <h2>Crear Nuevo Evento</h2>
            <form method="post" action="guardar.php" class="tarjeta">
                <div class="grupo-input">
                    <label for="titulo">Título</label>
                    <input type="text" id="titulo" name="titulo" placeholder="Ej. Reunión de equipo" required>
                </div>

                <div class="grupo-input">
                    <label for="fecha">Fecha</label>
                    <input type="date" id="fecha" name="fecha" required>
                </div>

                <div class="grupo-input">
                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion" name="descripcion" placeholder="Detalles del evento..." rows="4"></textarea>
                </div>

                <button type="submit" class="btn-principal">Agregar evento</button>
            </form>
        </section>

        <!-- 2. La tabla de eventos -->
        <section class="seccion-tabla">
            <h2>Lista de Eventos</h2>
            <div class="tarjeta contenedor-tabla">
                <table id="tabla-eventos">
                    <thead>
                        <tr>
                            <th>Título</th>
                            <th>Fecha</th>
                            <th>Descripción</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Reunión de bienvenida</td>
                            <td>2026-10-25</td>
                            <td>Presentación oficial del proyecto y organización de tareas.</td>
                            <td>
                                <button class="btn-accion btn-editar">Editar</button>
                                <button class="btn-accion btn-eliminar">Eliminar</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>Desarrollo de Aplicaciones Web · Ciclo 2026-B</p>
    </footer>

</body>
</html>
